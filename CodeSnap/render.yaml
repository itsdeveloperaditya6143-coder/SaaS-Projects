# CodeSnap — Render Blueprint
# In Render dashboard: New > Blueprint > select repo SaaS-Projects
# and set "Blueprint file" to: CodeSnap/render.yaml
# (because repo root is Projects/, app lives in CodeSnap/)
#
# This creates 2 services:
#   1. codesnap-backend  (Python web service, serves API + fallback)
#   2. codesnap-frontend (Static site, the actual UI)
# The frontend works 100% standalone (all PNG export is client-side),
# backend is only needed if you want /api/* later.

services:
  # ---------- BACKEND (Flask) ----------
  - type: web
    name: codesnap-backend
    env: python
    rootDir: CodeSnap/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # ---------- FRONTEND (Static) ----------
  - type: web
    name: codesnap-frontend
    env: static
    rootDir: CodeSnap/frontend
    buildCommand: echo "static site - no build needed"
    staticPublishPath: ./
    # No server-side routing needed (single index.html),
    # but keep SPA fallback so refresh on any path works:
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
